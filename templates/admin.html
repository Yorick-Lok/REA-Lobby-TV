<button type="button" id="Upload">Upload </button>

<div id="drop-zone" style="width: 300px; height: 200px; border: 2px dashed #ccc; display: flex; align-items: center; justify-content: center;">
  Drag and drop files here
</div>


<script>
  // 1. Select the button using its ID
  const button = document.getElementById('Upload');

  // 2. Define what happens when the button is clicked
  function handleButtonClick() {

    // Show a confirmation dialog to the user.
    if (confirm("Are you sure you want to upload the file?")) {
      // 1. Upload the file and show a success message.
      alert("File uploaded succesfully!");
    }
    else {
      // 2. If the user cancels, end the function and do not proceed with the upload.
      return;
    }
  }
  

  // 3. Attach the event listener to the button
  button.addEventListener('click', handleButtonClick);
</script>

<script>
  const dropZone = document.getElementById('drop-zone');

  // 1. Necessary to allow a drop in Chrome
  dropZone.addEventListener('dragover', (e) => {
    e.preventDefault(); 
    e.dataTransfer.dropEffect = 'copy'; // Visual indicator: shows copy icon
  });

  // 2. Handle the drop action
  dropZone.addEventListener('drop', (e) => {
    e.preventDefault(); // Stop Chrome from opening the file directly

    const files = e.dataTransfer.files;
    if (files.length > 0) {
      console.log(`${files.length} file(s) dropped.`);
      // Process files here (e.g., append to FormData or upload via XHR/Fetch)
      for (let i = 0; i < files.length; i++) {
        console.log(`File name: ${files[i].name}`);
      }
    }
  });
</script>
