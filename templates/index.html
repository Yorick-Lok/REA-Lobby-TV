<!DOCTYPE html>
<html>
<head>
    <title>REA Lobby TV</title>
    <meta http-equiv="Cache-Control" content="no-cache">
    <script src="/static/socket.io.min.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }
        video {
            display: block;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            background: #000;
        }
        #debug {
            position: fixed;
            bottom: 12px;
            left: 12px;
            z-index: 1000;
            padding: 10px 14px;
            max-width: 450px;
            max-height: 35vh;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            font: 12px monospace;
            pointer-events: none;
        }
        #debug .event {
            white-space: nowrap;
        }
        #debug .error {
            color: #ff5555;
        }
        #debug .success {
            color: #55dd88;
        }
    </style>
</head>
<body>

<video id="video" autoplay loop muted playsinline preload="metadata">
    <source id="screen" type="video/mp4">
    Your browser does not support the video tag.
</video>

<div id="debug">
    <div id="status">Initializing...</div>
    <div id="events"></div>
</div>

<script>
    let socket;
    const video = document.getElementById("video");
    const source = document.getElementById("screen");
    const status = document.getElementById("status");
    const events = document.getElementById("events");

    function logEvent(name, error = false) {
        const time = new Date().toLocaleTimeString();
        const entry = document.createElement("div");
        entry.className = `event${error ? " error" : ""}`;
        entry.textContent = `[${time}] ${name}`;

        events.prepend(entry);

        // Keep the latest 12 events.
        while (events.children.length > 12) {
            events.lastElementChild.remove();
        }

        console.log(`[VIDEO] ${name}`);
    }

function getBufferInfo() {
    const ranges = [];

    for (let i = 0; i < video.buffered.length; i++) {
        ranges.push(
            `${video.buffered.start(i).toFixed(1)}-${video.buffered.end(i).toFixed(1)}s`
        );
    }

    return ranges.join(", ") || "none";
}

function updateStatus() {
    status.textContent =
        `Time: ${video.currentTime.toFixed(1)}s / ${isFinite(video.duration) ? video.duration.toFixed(1) + "s" : "?"} | ` +
        `Ready: ${video.readyState} | Network: ${video.networkState} | ` +
        `Buffer: ${getBufferInfo()} | ` +
        `${video.paused ? "PAUSED" : "PLAYING"}`;
}

    const videoEvents = [
        "loadstart",
        "loadedmetadata",
        "loadeddata",
        "canplay",
        "canplaythrough",
        "play",
        "playing",
        "pause",
        "waiting",
        "stalled",
        "suspend",
        "seeking",
        "seeked",
        "ended",
        "abort",
        "emptied"
    ];

    videoEvents.forEach(event => {
        video.addEventListener(event, () => {
            logEvent(event);
            updateStatus();
        });
    });

    video.addEventListener("error", () => {
        const error = video.error;
        logEvent(
            `ERROR: ${error?.code} - ${error?.message || "Unknown error"}`,
            true
        );
        updateStatus();
    });

    video.addEventListener("timeupdate", updateStatus);

    source.src = `/static/Screen.mp4?t=${Date.now()}`;
    video.load();

    video.play().catch(error => {
        logEvent(`PLAY FAILED: ${error.message}`, true);
    });

    function connect_socket() {
        socket = io({ transports: ["websocket"] });

        socket.on("connect", () => {
            logEvent("Socket connected");
        });

        socket.on("disconnect", () => {
            logEvent("Socket disconnected", true);
        });

        socket.on("state", () => {
            window.location.reload();
        });
    }

    connect_socket();
    updateStatus();
</script>

</body>
</html>
