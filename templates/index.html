<!DOCTYPE html>
<html>
<head>
<title>REA Lobby TV</title>
<meta http-equiv="Cache-Control" content="no-cache">
<script src="static/socket.io.min.js"></script>
</head>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }

  body {
    min-height: 100vh;
  }

  video {
    display: block;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    background: #000;
  }
</style>
<body>

<video 
    width="100%" 
    height="100%" 
    autoplay  
    loop
    muted
    playsinline>
  <source id="screen" type="video/mp4">
Your browser does not support the video tag.
</video>

    <script>
      let socket;
      const video = document.getElementById("screen");
      video.src = `/static/Screen.mp4?t=${Date.now()}`

      function connect_socket()
      {
        socket = io({transports: ['websocket']})

        socket.on("connect", () => {
          
        })

        socket.on("state", () => {
          window.location.reload()
        })
      }

      connect_socket();
    </script>

</body>
</html>
